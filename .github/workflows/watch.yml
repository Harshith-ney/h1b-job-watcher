name: job-watcher

on:
  schedule:
    - cron: "17 * * * *"     # hourly at :17
  workflow_dispatch:

concurrency:
  group: job-watcher
  cancel-in-progress: false

permissions:
  contents: write            # to commit state/jobs.db back

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - name: Scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python main.py run

      - name: Persist state
        if: always()
        run: |
          git config user.name  "job-watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/jobs.db
          git diff --cached --quiet || (git commit -m "state: scan $(date -u +%FT%TZ) [skip ci]" && git pull --rebase && git push)
