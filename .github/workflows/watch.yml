name: job-watcher

on:
  schedule:
    - cron: "17 * * * *"     # hourly at :17
  workflow_dispatch:

concurrency:
  group: job-watcher
  cancel-in-progress: false

permissions:
  contents: write            # to force-push the state branch

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - name: Restore state
        run: |
          mkdir -p state
          if git fetch --depth=1 origin state; then
            git show FETCH_HEAD:jobs.db > state/jobs.db
            echo "restored $(du -h state/jobs.db | cut -f1)"
          else
            echo "no state branch yet - starting fresh"
          fi

      - name: Scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python main.py run

      - name: Persist state (single-commit orphan branch, no history growth)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f state/jobs.db ] || exit 0
          rm -rf /tmp/sb && mkdir /tmp/sb && cp state/jobs.db /tmp/sb/
          cd /tmp/sb
          git init -q -b state
          git config user.name  "job-watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.db
          git commit -qm "state $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state
